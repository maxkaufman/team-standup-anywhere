spring:
  application:
    name: teampulse

  # Default profile uses H2 for local development
  datasource:
    url: jdbc:h2:mem:teampulse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  graphql:
    graphiql:
      enabled: true
    path: /graphql
    schema:
      inspection:
        enabled: true

  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

# JWT Configuration
jwt:
  secret: teampulse-dev-secret-key-change-in-production-min-256-bits-long!!
  expiration: 86400000       # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

# AWS S3 Configuration
aws:
  s3:
    bucket: teampulse-avatars
    region: us-east-1
    presigned-url-expiration: 3600  # 1 hour in seconds

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teampulse}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:teampulse}
    password: ${DB_PASSWORD:}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
