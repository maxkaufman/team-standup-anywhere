# Local development setup
# Run: docker-compose up -d
services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teampulse
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: teampulse_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot backend
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: teampulse
      DB_USERNAME: teampulse
      DB_PASSWORD: teampulse_dev
      JWT_SECRET: teampulse-docker-dev-secret-key-change-in-production-256!!
    depends_on:
      postgres:
        condition: service_healthy

  # React frontend (dev mode with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
